<!DOCTYPE html>

                    <h1 class="glitch" data-text="ZHEZHU">ZHEZHU</h1>
                </div>
                <div class="tagline">
                    <span class="typing-text"></span>
                    <span class="cursor">_</span>

            <section class="about">
                <div class="section-header">
                    <span class="line"></span>
                    <span class="label">ABOUT</span>

                        <span class="project-arrow">→</span>
                    </a>
                </div>
            </section>

            <section class="contact">
                <div class="section-header">
                    <span class="line"></span>
                    <span class="label">CONNECT</span>
                </div>
                <div class="contact-grid">
                    <a href="mailto:shizhezhu@qq.com" class="contact-card">
                        <span class="contact-icon">@</span>
                        <span class="contact-label">EMAIL</span>
                        <span class="contact-value">shizhezhu@qq.com</span>
                    </a>
                    <a href="https://github.com/zhezhu0304" target="_blank" class="contact-card">
                        <span class="contact-icon">GH</span>
                        <span class="contact-label">GITHUB</span>
                        <span class="contact-value">zhezhu0304</span>
